services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017
      JWT_SECRET: change-me
      CLIENT_URL: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  client:
    build:
      context: ./client
    environment:
      VITE_BASE_URL: http://localhost:3000
      VITE_CURRENCY: $
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo-data:
